[workspace]
resolver = "2"
members = ["crates/aop-core", "crates/aop-app", "crates/aop-procname", "crates/aop-collaborate"]

[workspace.package]
version = "1.0.2-beta"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Lives beside the other Alterion crates, published separately.
alterion-mpp-parser = { version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
