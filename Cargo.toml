[workspace]
resolver = "2"
members = ["crates/aop-core", "crates/aop-app", "crates/aop-procname", "crates/aop-collaborate"]

[workspace.package]
version = "1.0.5-beta"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Lives beside the other Alterion crates, published separately.
alterion-mpp-parser = { version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Blitz's click events carry only the client point, and 0.7.10 leaves
# `element_coordinates` as `unimplemented!()`, so any handler asking where a
# click landed inside its own element brings the process down. The information
# is present at dispatch, it was simply never joined up; this fills that in and
# changes nothing else. Fixed upstream in 0.8, which pins an alpha of the whole
# framework, so this stands in until that is released.
[patch.crates-io]
dioxus-native-dom = { path = "vendor/dioxus-native-dom" }
# And the crate above it, so a font can be carried with the program rather
# than hoped for on the machine it runs on. See vendor/dioxus-native/src/config.rs.
dioxus-native = { path = "vendor/dioxus-native" }
