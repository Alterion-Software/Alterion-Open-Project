[workspace]
resolver = "2"
members = ["crates/aop-core", "crates/aop-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Lives beside the other Alterion crates, published separately.
alterion-mpp-parser = { version = "0.1.0", path = "../crates/alterion-mpp-parser" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
